[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omadown"
version = "1.0.0"
description = "Downie 4 style queue downloader for Omarchy / Linux (multi-engine: yt-dlp, native HLS, page sniffing, direct)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["downloader", "hls", "m3u8", "yt-dlp", "hyprland", "omarchy", "wayland"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
# Runtime dependencies are intentionally empty: omadown is standard library only
# and shells out to `yt-dlp` and `ffmpeg`, which are system packages on Arch.
dependencies = []

[project.optional-dependencies]
fast = ["cryptography>=42"]           # accelerates AES-128 HLS decryption
render = ["playwright>=1.40"]         # enables --render page sniffing

[project.scripts]
omadown = "omadown.cli:main"

[tool.setuptools]
packages = ["omadown", "omadown.backends"]

[tool.setuptools.package-data]
omadown = ["py.typed"]
